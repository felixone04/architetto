# Anteprima statica del sito su GitHub Pages, aggiornata a ogni push su master.
# Il sito vero gira su Hostinger con PHP e MySQL: questa copia serve solo a
# vedere la grafica (i dati restano nel browser di chi la apre).
name: Anteprima su GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php demo/build.php _site "/${{ github.event.repository.name }}/" "https://${{ github.repository_owner }}.github.io"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
